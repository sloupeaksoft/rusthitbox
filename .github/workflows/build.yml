name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download Gradle 4.10.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q gradle-4.10.3-bin.zip
      - name: Build
        run: ./gradle-4.10.3/bin/gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rusthitbox-1.12.2
          path: build/libs/*.jar
